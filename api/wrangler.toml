name = "todo-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# DATABASE_URL is a Cloudflare *Secret* (set in the dashboard) — never put it here.
# Local dev reads it from .dev.vars (gitignored).

[vars]
# Deployed frontend origin(s), comma-separated. localhost is always allowed.
ALLOWED_ORIGINS = "https://todo-frontend.michael-lotz.workers.dev"

# Settings for Cloudflare preview builds (non-main branches). Deliberately empty: previews only
# allow localhost and get no DATABASE_URL, so they can never touch the live page or production data.
[previews.vars]
ALLOWED_ORIGINS = ""
